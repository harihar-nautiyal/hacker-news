[package]
name = "maud-htmx"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
anyhow = "1.0.104"
async-trait = "0.1.92"
bitflags = "2.13.1"
dashmap = "6.2.1"
maud = { version = "0.27.0", features = ["actix-web"] }
mime_guess = "2.0.5"
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["json"] }
rust-embed = { version = "8.12.0", features = ["actix-web"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
typed-builder = "0.23.2"
url = "2.5.8"
urlencoding = "2.1.3"

[lints.rust]
non_snake_case = "allow"
